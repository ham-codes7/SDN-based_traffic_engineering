[project]
name = "sdnte"
version = "0.1.0"
description = "SDN-based intelligent traffic engineering using deep reinforcement learning"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "networkx>=3.2",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "streamlit>=1.35",
    "tensorboard>=2.16",
    "tabulate>=0.10.0",
]

[project.scripts]
sdnte = "sdnte.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdnte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
